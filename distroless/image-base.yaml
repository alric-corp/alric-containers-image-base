# Composicao compartilhada, sem fonte de pacotes: `repositories` e `keyring`
# vivem em distroless/sources/<source>.yaml e sao escolhidos pela cadeia de
# include do framework. O `include` do apko faz APPEND de listas, nunca
# override -- declarar uma fonte aqui e outra no framework produziria um
# artifact com dois keyrings. Os pacotes abaixo existem nas duas distros.
contents:
  # wolfi-base NÃO entra aqui de propósito: ele depende de apk-tools + busybox,
  # o que dá shell e gerenciador de pacotes em toda imagem "distroless" que
  # inclui este arquivo. wolfi-baselayout já vem transitivamente via
  # ca-certificates-bundle, então não falta nada essencial sem wolfi-base.
  packages:
    - ca-certificates-bundle
    - image-base-ca-certificates
    - tzdata

# Apko integra as âncoras do pacote ao PEM e, quando presente, ao JKS.
# Nenhum hook, shell ou update-ca-certificates precisa entrar no runtime.
certificates:
  providers:
    - custom-ca-certificates

layering:
  strategy: origin
  budget: 10

work-dir: /app

paths:
  - path: /app
    type: directory
    uid: 10000
    gid: 10000
    permissions: 0o755

environment:
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt

archs:
  - amd64
  - arm64
