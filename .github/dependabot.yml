version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep this origin aligned with policies/governance/reusable-workflows.json.
      # The reviewed-origin resolver rejects partial migrations of this group.
      reusable-container-pipeline:
        patterns:
          - "alric-corp/alric-containers-reusable-workflows*"
