name: Distroless - Build & publish

on:
  # Allow-list (em vez de paths-ignore): só dispara pra mudanças que
  # realmente afetam a imagem publicada. paths-ignore com só "**.md" deixava
  # qualquer outro arquivo não-.md disparar o build inteiro sem necessidade.
  push:
    branches: [develop]
    paths:
      - 'frameworks/**'
      - 'distroless/**'
      - 'melange/**'
      - '.github/workflows/workflow.yml'
      - '.github/workflows/build-base-images.yml'
      - '.github/workflows/dev-stable.yml'
      - '.github/workflows/validate-base-images.yml'
      - '.github/workflows/test-runtime-images.yml'
      - '.github/workflows/image-trust.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'policies/**'
      # O contrato funcional é gate de publicação (M08/M10): mudar um projeto
      # mínimo ou um probe muda o que autoriza publicar.
      - 'tests/runtime/**'
      - 'tests/consumer-apps/**'
      - 'Makefile'
  # Sem filtro de paths: um required check de workflow filtrado ficaria
  # pendente para sempre em PRs de outros caminhos. O resolvedor aplica a
  # mesma allow-list do push e devolve NONE quando nenhum path a toca; o
  # gate agregado abaixo reporta em todo PR.
  pull_request: {}
  schedule:
    - cron: "23 3 * * *"   # build diário: 00:23 America/Sao_Paulo (03:23 UTC; fora do início da hora)
  workflow_dispatch:
    # Golden path do LAB (ADR-0008): seleção fixa e auditável. A
    # FULL_CERTIFICATION fica em catalog-certification.yml (sob demanda);
    # este entrypoint não aceita ampliar o escopo sem mudança revisada.

# PRs recebem apenas leitura. Escrita/OIDC são concedidos nos jobs autorizados.
permissions:
  contents: read

jobs:
  pr_execution_scope:
    name: Resolve PR execution profile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - name: Checkout PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve changed-path profile
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_PATHS: ${{ runner.temp }}/pr-changed-paths
        run: |
          set -euo pipefail
          # --no-renames lists both sides of a move: moving a script out of
          # the product still selects validation.
          if ! git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_PATHS"; then
            # Missing/unavailable history is ambiguous and must fail safe to FULL.
            printf '%s\n' '__unknown_changed_path__' > "$CHANGED_PATHS"
          fi
          python3 -B -m scripts.pipeline.governance.pr_execution_scope \
            --paths-file "$CHANGED_PATHS" >> "$GITHUB_OUTPUT"

  validate-pr:
    if: github.event_name == 'pull_request' && needs.pr_execution_scope.outputs.profile == 'P0_04'
    needs: [pr_execution_scope]
    # M14: um novo commit no mesmo PR cancela a validação obsoleta (apko +
    # Trivy, sem AWS) em vez de rodar as duas até o fim; PRs diferentes têm
    # grupos diferentes e não se cancelam. Grupo próprio, nunca compartilhado
    # com build-base-images abaixo — esse nunca pode ser cancelado por um
    # PR/build novo.
    concurrency:
      group: validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: '["go1-26", "go1-26-dev"]'

  validate-pr-full:
    name: Validate full catalog for shared-impact PR
    if: github.event_name == 'pull_request' && needs.pr_execution_scope.outputs.profile == 'FULL'
    needs: [pr_execution_scope]
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: '["dotnet10", "dotnet10-dev", "go1-25", "go1-25-dev", "go1-26", "go1-26-dev", "java21", "java21-dev", "java25", "java25-dev", "nodejs22", "nodejs22-dev", "nodejs24", "nodejs24-dev", "python3-13", "python3-14"]'

  # Nome estável que reporta em todo PR (G02): exige o resultado da validação
  # selecionada pelo perfil. Não faz checkout nem executa código do PR; só
  # lê os resultados dos jobs acima. Torná-lo required é decisão de Settings.
  validation-gate:
    name: Factory PR validation gate
    if: always() && github.event_name == 'pull_request'
    needs: [pr_execution_scope, validate-pr, validate-pr-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the validation selected for this PR
        env:
          SCOPE: ${{ needs.pr_execution_scope.result }}
          PROFILE: ${{ needs.pr_execution_scope.outputs.profile }}
          P0_04: ${{ needs.validate-pr.result }}
          FULL: ${{ needs.validate-pr-full.result }}
        run: |
          set -eu
          fail() { echo "::error::$1" >&2; exit 1; }
          echo "profile=${PROFILE:-none} scope=$SCOPE validate-pr=$P0_04 validate-pr-full=$FULL"
          [ "$SCOPE" = success ] || fail "PR execution profile was not resolved ($SCOPE)"
          case "$PROFILE" in
            NONE) [ "$P0_04" = skipped ] && [ "$FULL" = skipped ] \
                    || fail "NONE profile must not run image validation" ;;
            P0_04) [ "$P0_04" = success ] && [ "$FULL" = skipped ] \
                     || fail "P0_04 validation did not succeed ($P0_04)" ;;
            FULL) [ "$FULL" = success ] && [ "$P0_04" = skipped ] \
                    || fail "FULL validation did not succeed ($FULL)" ;;
            *) fail "unknown PR execution profile: ${PROFILE:-empty}" ;;
          esac

  build-base-images:
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 * * *')
    # Hold one repository-wide slot across validation, contracts, publication
    # and signing/attestation in the reusable call. PR validation is separate.
    # Keep an active publisher running; GitHub may replace older pending jobs.
    concurrency:
      group: factory-build-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-base-images.yml
    with:
      frameworks: '["go1-26", "go1-26-dev"]'
