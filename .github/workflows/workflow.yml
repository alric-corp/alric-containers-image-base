name: Build & publish base images

on:
  # Allow-list (em vez de paths-ignore): só dispara pra mudanças que
  # realmente afetam a imagem publicada. paths-ignore com só "**.md" deixava
  # qualquer outro arquivo não-.md disparar o build inteiro sem necessidade.
  push:
    branches: [main]
    paths:
      - 'frameworks/**'
      - 'distroless/**'
      - 'melange/**'
      - '.github/workflows/workflow.yml'
      - '.github/workflows/build-base-images.yml'
      - '.github/workflows/validate-base-images.yml'
      - '.github/workflows/test-runtime-images.yml'
      - '.github/workflows/image-trust.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'policies/**'
      - '.github/workflows/promote-stable.yml'
      # O contrato funcional é gate de publicação (M08/M10): mudar um projeto
      # mínimo ou um probe muda o que autoriza publicar.
      - 'tests/runtime/**'
      - 'Makefile'
  pull_request:
    paths:
      - 'frameworks/**'
      - 'distroless/**'
      - 'melange/**'
      - '.github/workflows/workflow.yml'
      - '.github/workflows/build-base-images.yml'
      - '.github/workflows/validate-base-images.yml'
      - '.github/workflows/test-runtime-images.yml'
      - '.github/workflows/image-trust.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'policies/**'
      - '.github/workflows/promote-stable.yml'
      # O contrato funcional é gate de publicação (M08/M10): mudar um projeto
      # mínimo ou um probe muda o que autoriza publicar.
      - 'tests/runtime/**'
      - 'Makefile'
  schedule:
    - cron: "0 3 * * *"   # build diário: 00:00 America/Sao_Paulo (03:00 UTC)
    - cron: "17 * * * *"  # promoção horária; soak mínimo contado desde o push
  workflow_dispatch:
    # P0-04: o caminho automático (schedule e push na main) continua com
    # seleção fixa e auditável — o lote Go 1.26. O dispatch manual permite
    # escolher explicitamente quais frameworks do catálogo rodar, para
    # habilitar um framework novo sem ampliar o escopo automático. O input
    # não é confiado: `scripts.pipeline.catalog.validate_inputs` o confere
    # contra o próprio catálogo (frameworks/*.yaml) antes de qualquer build
    # ou autenticação AWS, e recusa nome desconhecido, repetido ou traversal.
    inputs:
      frameworks:
        description: 'JSON array de frameworks do catálogo (ex.: ["dotnet8", "dotnet8-dev"])'
        type: string
        default: '["go1-26", "go1-26-dev"]'

# PRs recebem apenas leitura. Escrita/OIDC são concedidos nos jobs autorizados.
permissions:
  contents: read

jobs:
  pr_execution_scope:
    name: Resolve PR execution profile
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
    steps:
      - name: Checkout PR history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve changed-path profile
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_PATHS: ${{ runner.temp }}/pr-changed-paths
        run: |
          set -euo pipefail
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_PATHS"; then
            # Missing/unavailable history is ambiguous and must fail safe to FULL.
            printf '%s\n' '__unknown_changed_path__' > "$CHANGED_PATHS"
          fi
          python3 -B -m scripts.pipeline.governance.pr_execution_scope \
            --paths-file "$CHANGED_PATHS" >> "$GITHUB_OUTPUT"

  validate-pr:
    if: github.event_name == 'pull_request' && needs.pr_execution_scope.outputs.profile == 'P0_04'
    needs: [pr_execution_scope]
    # M14: um novo commit no mesmo PR cancela a validação obsoleta (apko +
    # Trivy, sem AWS) em vez de rodar as duas até o fim; PRs diferentes têm
    # grupos diferentes e não se cancelam. Grupo próprio, nunca compartilhado
    # com build-base-images/promote-stable abaixo — esses nunca podem ser
    # cancelados por um PR/build novo.
    concurrency:
      group: validate-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: '["go1-26", "go1-26-dev"]'

  validate-pr-full:
    name: Validate full catalog for shared-impact PR
    if: github.event_name == 'pull_request' && needs.pr_execution_scope.outputs.profile == 'FULL'
    needs: [pr_execution_scope]
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: '["dotnet10", "dotnet10-dev", "dotnet8", "dotnet8-dev", "go1-25", "go1-25-dev", "go1-26", "go1-26-dev", "java21", "java21-dev", "java25", "java25-dev", "nodejs22", "nodejs22-dev", "nodejs24", "nodejs24-dev", "python3-13", "python3-14"]'

  build-base-images:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *')
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-base-images.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      # Só o dispatch manual escolhe; schedule e push continuam no lote fixo.
      frameworks: ${{ github.event_name == 'workflow_dispatch' && inputs.frameworks || '["go1-26", "go1-26-dev"]' }}

  promote-stable:
    if: github.ref == 'refs/heads/main' && github.event.schedule == '17 * * * *'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/promote-stable.yml
    with:
      aws-region: ${{ vars.AWS_REGION }}
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      soak-hours: 6
      frameworks: '["go1-26", "go1-26-dev"]'
# no-op, testing M14 cancel-in-progress
