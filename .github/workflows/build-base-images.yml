name: Build base images (reusable)

on:
  workflow_call:
    inputs:
      aws-region:
        description: "Região AWS do ECR (ex.: us-east-1)"
        type: string
        required: true
      aws-role-arn:
        description: "Role assumida via OIDC com permissão de push no ECR"
        type: string
        required: true
      frameworks:
        description: "JSON array de frameworks a buildar (deve casar com um arquivo em frameworks/<nome>.yaml)."
        type: string
        required: true

permissions:
  id-token: write           # obrigatório para o OIDC assumir a role AWS e para o cosign keyless (Sigstore)
  contents: read
  actions: read            # leitura de artifacts pelos contratos e resumo
  attestations: write       # obrigatório para actions/attest-build-provenance
  artifact-metadata: write  # storage record da attestation (evita o warning "Failed to persist storage record")

env:
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.2-immutable@sha256:4a16d57b37617a04b3d643079a477a2848efe892dffcdf0ce56df4262b65f810

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate-base-images.yml
    with:
      frameworks: ${{ inputs.frameworks }}

  # M08/M10: cobertura funcional é decidida em código versionado
  # (runtime_images.plan), não pela ausência de um artifact. Um contrato
  # compilado só entra na matriz se o par -dev estiver no MESMO lote — o
  # estágio de build é o artifact candidato, não uma imagem de registry.
  plan:
    name: Plan functional contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      contracts: ${{ steps.contracts.outputs.planned }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow inputs before privileged operations
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
        run: python3 -B -m scripts.pipeline.catalog.validate_inputs

      - name: Resolve which frameworks have an executable contract in this batch
        id: contracts
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
        run: |
          set -eu
          python3 -B -m scripts.pipeline.runtime.runtime_images --plan "$FRAMEWORKS" | tee contract-plan.json
          python3 -B - <<'PY'
          import json
          import os
          plan = json.load(open('contract-plan.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"planned={json.dumps(plan['planned'])}\n")
          for framework, reason in plan['skipped'].items():
              print(f'::notice::{framework}: contrato funcional não executado — {reason}')
          PY

  # Execução funcional sobre o artifact candidato, antes de publicar:
  # aprovação de build/scan não substitui rodar a imagem.
  runtime-contract:
    name: Functional contract
    needs: [validate, plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.contracts != '[]'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.plan.outputs.contracts || '[]') }}
    uses: ./.github/workflows/test-runtime-images.yml
    with:
      framework: ${{ matrix.framework }}

  build-push:
    name: Build & push ${{ matrix.framework }}
    # M13: `needs: validate` sozinho pularia TODA a matriz de publicação se
    # QUALQUER framework falhasse a validação (um scan bloqueado por CVE sem
    # correção na origem, por exemplo — caso histórico do dotnet8, removido
    # do catálogo) — needs trata o job `validate` (com
    # sua própria matriz interna) como um resultado agregado, não por framework.
    # `if: always()` evita esse skip em massa; o isolamento por framework de
    # verdade acontece no passo "Download validated OCI artifact" abaixo —
    # cada leg da matriz só publica se o SEU PRÓPRIO artifact aprovado
    # existir. Não é `continue-on-error` no scan (o scan de cada framework
    # continua falhando normalmente, dentro do job `validate`) nem
    # `if: always()` sozinho sem a checagem — a falha de validação de um
    # framework continua visível e sem publicação, só não derruba os outros
    # frameworks do lote.
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [validate, runtime-contract]
    runs-on: ubuntu-latest
    # Observado: 32-110s por framework num run real de 11 frameworks (M14);
    # dotnet10 (maior artifact) foi o mais lento. Margem cobre variância de
    # rede nas chamadas AWS/ECR/cosign/Sigstore.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(inputs.frameworks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow inputs before privileged operations
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
        run: python3 -B -m scripts.pipeline.catalog.validate_inputs

      - name: Download validated OCI artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-oci-${{ matrix.framework }}
          path: image.oci

      # Framework isolado: sem o artifact aprovado (validate falhou pra
      # ESTE framework especificamente, ou nunca rodou por falha na
      # dependência comum do bundle), esta leg falha aqui — visível, sem
      # publicação — sem afetar as legs de outros frameworks cujo artifact
      # foi aprovado normalmente.
      # M16: o nome do framework chega por env (já validado no passo acima),
      # nunca interpolado direto no corpo do script deste job privilegiado.
      - name: Require validated artifact
        if: steps.download.outcome == 'failure'
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          echo "::error::Nenhum artifact validado para ${FRAMEWORK} — validação falhou ou não rodou (ver job 'validate'). Publicação abortada para este framework." >&2
          exit 1

      # M08/M10: o contrato funcional deste framework precisa ter passado nas
      # duas plataformas. Evidência ausente é falha, não aprovação — e um
      # framework sem contrato (cobertura gradual) recebe a mensagem do
      # motivo, decidido pelo mesmo código versionado que montou a matriz.
      - name: Resolve publication contract and its validated build variant
        id: contract-plan
        env:
          FRAMEWORK: ${{ matrix.framework }}
          FRAMEWORKS: ${{ inputs.frameworks }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from scripts.pipeline.runtime import runtime_images
          framework = os.environ['FRAMEWORK']
          planned, _ = runtime_images.plan(json.loads(os.environ['FRAMEWORKS']))
          required = framework in planned
          dev = (runtime_images.project(framework)[1]
                 if required and runtime_images.supported(framework) == 'compiled' else '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'required={str(required).lower()}\ndev={dev}\n')
          PY

      - name: Download current validated build variant for digest binding
        if: steps.contract-plan.outputs.dev != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: validated-oci-${{ steps.contract-plan.outputs.dev }}
          path: runtime-dev.oci
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: List artifacts and producer jobs of this workflow run
        if: steps.contract-plan.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" > runtime-artifacts.json
          gh api --paginate --slurp "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" > runtime-jobs.json

      # P1-02: attempt anterior pode conter o contrato aprovado. A busca é
      # restrita ao run; o gate confere identidade/digests e ordena attempts.
      # Não mergear reports homônimos de artifacts diferentes.
      - name: Download functional contract evidence
        id: contract
        if: steps.contract-plan.outputs.required == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: runtime-${{ matrix.framework }}-[0-9]*
          path: runtime-gate
          merge-multiple: false
          digest-mismatch: error
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Require the functional contract of this framework
        env:
          FRAMEWORK: ${{ matrix.framework }}
          FRAMEWORKS: ${{ inputs.frameworks }}
          CONTRACT_DOWNLOAD: ${{ steps.contract.outcome }}
        run: |
          python3 -B -m scripts.pipeline.runtime.runtime_images image.oci --gate "$FRAMEWORK" \
            --requested "$FRAMEWORKS" --reports runtime-gate --dev-layout runtime-dev.oci \
            --artifact-metadata runtime-artifacts.json --job-metadata runtime-jobs.json \
            --download-result "$CONTRACT_DOWNLOAD" --gate-output runtime-gate-result.json

      - name: Require successful default trust integration
        env:
          TRUST_RESULT: ${{ needs.validate.outputs.image-trust-result }}
        run: test "$TRUST_RESULT" = success

      - name: Verify artifact integrity and platforms
        id: verified
        run: |
          set -eu
          DIGEST=$(python3 -B -m scripts.pipeline.artifacts.oci_artifact verify image.oci)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify pinned Skopeo is available
        run: |
          set -euo pipefail
          docker run --rm --pull=always "$SKOPEO_IMAGE" --version | tee skopeo-version.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Record publication tool versions
        run: python3 -B -m scripts.pipeline.operations.tool_versions publication tool-versions.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      # Infra é source of truth da configuração do ECR; Containers valida o
      # destino pré-provisionado e falha fechado sem criar ou reparar recursos.
      - name: Validate pre-provisioned ECR repository
        env:
          FRAMEWORK: ${{ matrix.framework }}
          EXPECTED_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          REPO="image-base-${FRAMEWORK}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if ! aws ecr describe-repositories --region "$EXPECTED_REGION" \
            --repository-names "$REPO" > ecr-repository.json 2>ecr-error.txt; then
            if grep -q 'RepositoryNotFoundException' ecr-error.txt; then
              echo "::error::Pre-provisioned ECR repository not found. Provision it through this product's infra/ecr before publishing: ${REPO}" >&2
            else
              cat ecr-error.txt >&2
            fi
            exit 1
          fi
          python3 -B -m scripts.pipeline.release.validate_ecr_repository \
            ecr-repository.json "$REPO" "$ACCOUNT" "$EXPECTED_REGION" \
            > ecr-repository-validation.json

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Referência da imagem: <registry-ecr>/image-base-<framework>, com uma
      # tag imutável <ddmmaa-hhmm> (GMT-3 / America/Sao_Paulo). A tag "stable"
      # NÃO é publicada aqui — ela só é promovida pelo workflow
      # promote-stable.yml, depois de uma janela de soak sem novas CVEs
      # (ver "Gate de promoção" no README).
      - name: Set image name and tags
        env:
          FRAMEWORK: ${{ matrix.framework }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -eu
          echo "IMAGE_NAME=${REGISTRY}/image-base-${FRAMEWORK}" >> "$GITHUB_ENV"
          echo "TIMESTAMP_TAG=$(TZ='America/Sao_Paulo' date +%d%m%y-%H%M)-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Copia os mesmos manifests e layers validados; nenhuma resolução de pacotes.
      - name: Publish validated OCI artifact (multi-arch)
        id: publish
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EXPECTED: ${{ steps.verified.outputs.digest }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/skopeo-auth"
          trap 'rm -f "$RUNNER_TEMP/skopeo-auth/config.json"' EXIT
          aws ecr get-login-password | docker run --rm -i \
            -v "$RUNNER_TEMP/skopeo-auth":/auth "$SKOPEO_IMAGE" \
            login --authfile /auth/config.json --username AWS --password-stdin "$REGISTRY"
          docker run --rm -v "$PWD":/work -w /work \
            -v "$RUNNER_TEMP/skopeo-auth/config.json":/auth/config.json:ro "$SKOPEO_IMAGE" \
            copy --all --preserve-digests --authfile /auth/config.json \
            --digestfile /work/published.digest \
            oci:/work/image.oci:image "docker://${IMAGE_NAME}:${TIMESTAMP_TAG}"
          ACTUAL=$(cat published.digest)
          test "$EXPECTED" = "$ACTUAL"
          # Leia a tag publicada de volta: prova independente do digestfile.
          docker run --rm \
            -v "$RUNNER_TEMP/skopeo-auth/config.json":/auth/config.json:ro "$SKOPEO_IMAGE" \
            inspect --raw --authfile /auth/config.json \
            "docker://${IMAGE_NAME}:${TIMESTAMP_TAG}" > published-index.json
          python3 -B -m scripts.pipeline.release.verify_publication \
            image.oci/validated-index.json published.digest published-index.json \
            "${IMAGE_NAME}@${ACTUAL}" > publication-evidence.json
          echo "image_ref=${IMAGE_NAME}@${ACTUAL}" >> "$GITHUB_OUTPUT"
          echo "digest=${ACTUAL}" >> "$GITHUB_OUTPUT"

      # Verificabilidade (padrão hardened, ver RFC-013 Fase 3): assina o
      # digest publicado com cosign keyless — usa o mesmo token OIDC do job
      # (audience Sigstore/Fulcio, não o da AWS), sem chave privada pra
      # gerenciar. A assinatura fica registrada no transparency log público
      # do Rekor e anexada ao próprio repositório ECR como um artefato OCI
      # adicional (tag "sha256-<digest>.sig" se o ECR ainda não suportar a
      # OCI Referrers API nesta região).
      - name: Sign published image (keyless)
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: |
          set -eu
          cosign sign --yes "${IMAGE_REF}"

      - name: Attest original SPDX SBOMs for index and both architectures
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
        run: python3 -B -m scripts.pipeline.release.publish_sboms image.oci "$IMAGE_REF"

      # Build provenance (SLSA) nativo do GitHub Actions: registra como,
      # onde (este workflow/run) e a partir de qual commit a imagem foi
      # construída. Fica disponível via `gh attestation verify` e, com
      # push-to-registry, também como artefato anexado no ECR.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Preserve publication evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-${{ matrix.framework }}-${{ github.run_attempt }}
          path: |
            image.oci/validated-index.json
            published.digest
            published-index.json
            publication-evidence.json
            runtime-gate-result.json
            runtime-artifacts.json
            runtime-jobs.json
            sbom-publication.json
            image.oci/sbom/
            image.oci/apko.lock.json
            image.oci/build-inputs.json
            ecr-repository-validation.json
            skopeo-version.txt
            tool-versions.json
          retention-days: 30
          if-no-files-found: warn

  # M11/M04: uma tabela por framework com digest, arquiteturas, resultado do
  # scan, motivo de bloqueio/skip, contrato funcional, publicação e links das
  # evidências. Roda mesmo quando algum framework falha — é justamente aí que
  # a tabela importa.
  summary:
    name: Run summary
    needs: [validate, plan, runtime-contract, build-push]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Só as evidências: os artifacts validated-oci-* têm centenas de MB e
      # não têm nada que a tabela use.
      - name: Download run evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: evidence
          pattern: '{build-scans-*,publication-*,runtime-*,promotion-*}'
          github-token: ${{ github.token }}

      - name: List artifacts of this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > artifacts.json || echo '{}' > artifacts.json

      - name: Publish per-framework result table
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -B -m scripts.pipeline.operations.pipeline_summary evidence \
            --frameworks "$FRAMEWORKS" --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --artifacts artifacts.json --annotate-contract-plan \
            --markdown "$GITHUB_STEP_SUMMARY" --json reports/pipeline-summary.json

      - name: Preserve the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-summary-${{ github.run_attempt }}
          path: reports/pipeline-summary.json
          retention-days: 30
          if-no-files-found: warn
