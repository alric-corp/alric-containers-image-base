name: Infra - PR plan

on:
  pull_request:
    branches: [develop]
    paths:
      - 'infra/**'
      - 'frameworks/**'
      - 'policies/pipeline/**'
      - 'scripts/pipeline/governance/configuration.py'
      - '.github/workflows/infra-pr.yml'
      - '.github/workflows/infra-apply.yml'
      - 'requirements-dev.txt'

permissions: {}

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'

concurrency:
  group: image-base-infra-state
  cancel-in-progress: false

jobs:
  checks:
    name: Infra contracts and formatting
    outputs:
      infra_plan_enabled: ${{ steps.pipeline.outputs.INFRA_PLAN_ENABLED }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope INFRA_PLAN
      - name: Install test dependencies
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Test Infra contracts without AWS credentials
        run: python3 -B -m unittest discover -s infra/tests -v
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff infra
      - name: Test the complete ECR root and S3 child with mocked AWS
        run: |
          terraform -chdir=infra/ecr init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/ecr validate
          terraform -chdir=infra/ecr test -no-color
      - name: Test DEV and HOM boundaries with mocked AWS providers
        run: |
          terraform -chdir=infra/lifecycle init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/lifecycle validate
          terraform -chdir=infra/lifecycle test -no-color

  plan:
    name: Infra plan (same-repository PR only)
    needs: checks
    if: github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && needs.checks.outputs.infra_plan_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # No environment: this role trusts the explicit pull_request subject.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope INFRA_PLAN
      - name: Configure Infra plan credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - name: Ensure independent backend before init
        run: |
          set -euo pipefail
          python3 infra/backend.py ensure \
            --bucket "$TF_STATE_BUCKET" --region "$TF_BACKEND_REGION" \
            --account-id "$AWS_ACCOUNT_ID" 2>&1 | tee "$RUNNER_TEMP/infra-backend-ensure.json"
      - name: Terraform init
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_BACKEND_REGION" 2>&1 | tee "$RUNNER_TEMP/infra-init.txt"
      - name: Terraform validate
        run: terraform -chdir=infra/ecr validate
      - name: Require the existing shared state and default workspace
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra/ecr show -json > "$RUNNER_TEMP/infra-selected-state.json"
          python3 infra/ecr/verify_state.py \
            --metadata infra/ecr/.terraform/terraform.tfstate \
            --state "$RUNNER_TEMP/infra-selected-state.json" \
            --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --region "$TF_BACKEND_REGION" \
            --workspace "$(terraform -chdir=infra/ecr workspace show)"
      - name: Plan and verify the catalog scope
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr plan -input=false -no-color -lock-timeout=5m \
            -var="aws_region=$AWS_REGION" -var="expected_bucket_owner=$AWS_ACCOUNT_ID" -out="$RUNNER_TEMP/infra.tfplan"
          terraform -chdir=infra/ecr show -no-color "$RUNNER_TEMP/infra.tfplan" > "$RUNNER_TEMP/infra-plan.txt"
          terraform -chdir=infra/ecr show -json "$RUNNER_TEMP/infra.tfplan" > "$RUNNER_TEMP/infra-plan.json"
          python3 infra/ecr/verify_plan.py "$RUNNER_TEMP/infra-plan.json" --mode sbom-adoption --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION"
          python3 infra/s3/readback.py preflight --plan "$RUNNER_TEMP/infra-plan.json" \
            --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --report "$RUNNER_TEMP/s3-preflight.json"
      - name: Publish plan summary
        run: |
          {
            echo '### Infra plan (no apply in PR)'
            echo '```text'
            cat "$RUNNER_TEMP/infra-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-pr-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/infra-backend-ensure.json
            ${{ runner.temp }}/infra-init.txt
            ${{ runner.temp }}/infra-plan.txt
            ${{ runner.temp }}/infra-plan.json
            ${{ runner.temp }}/s3-preflight.json
          retention-days: 5
          if-no-files-found: error
