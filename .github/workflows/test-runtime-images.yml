name: Distroless - Runtime contract

on:
  workflow_call:
    inputs:
      framework:
        type: string
        required: true
      artifact-run-id:
        description: 'Run containing validated-oci artifacts; empty means the caller run.'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      framework:
        type: choice
        required: true
        options: [nodejs22, nodejs24, nodejs22-dev, nodejs24-dev, python3-13, python3-14,
                  go1-25, go1-26, java21, java25, dotnet10]
      artifact-run-id:
        description: 'Run containing the validated-oci artifact in this repository.'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    uses: alric-corp/alric-containers-reusable-workflows/.github/workflows/test-runtime-images.yml@cc959d200afd7fc1bdc24fb240798b1bcdf5b42b # reviewed shared workflows
    with:
      framework: ${{ inputs.framework }}
      artifact-run-id: ${{ inputs.artifact-run-id }}
