name: Promote stable

# Gate de promoção da tag "stable": em vez de mover "stable" no mesmo run
# que publica a imagem, este workflow roda depois de uma janela de soak
# (default 6h) e só promove um build imutável se, decorrida essa janela,
# um re-scan Trivy continuar limpo. Isso cobre o cenário em que uma CVE é
# divulgada horas depois do build original (comum num repositório
# rolling-release como o Wolfi) — "stable" só avança se o build sobreviver
# ao soak sem nenhuma vulnerabilidade nova conhecida.
#
# Não é um canário de tráfego real (não há apps consumidoras na POC pra
# validar contra) — é um canário de tempo/CVE. Validar contra consumidores
# reais é responsabilidade de cada pipeline de deploy downstream.

on:
  workflow_call:
    inputs:
      aws-region:
        type: string
        required: true
      aws-role-arn:
        type: string
        required: true
      frameworks:
        description: "JSON array de frameworks a avaliar para promoção."
        type: string
        required: true
      soak-hours:
        description: "Horas mínimas que um build imutável precisa esperar antes de poder virar stable."
        type: number
        default: 6
  schedule:
    - cron: "17 * * * *"  # promoção horária; soak mínimo contado desde o push
  # Dispatch manual para testar o gate de promoção sem esperar as 6h reais de
  # soak (ex.: soak-hours=0 contra um build que acabou de ser publicado).
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'JSON array de frameworks a avaliar (ex.: ["go1-26"])'
        type: string
        default: '["go1-26"]'
      soak-hours:
        description: "Horas mínimas de soak (use 0 para testar contra um build recém-publicado)"
        type: number
        default: 6

permissions:
  id-token: write
  contents: read
  actions: read
  attestations: read

jobs:
  # workflow_call/workflow_dispatch already carry frameworks/soak-hours as
  # explicit inputs; a native `schedule` trigger has no inputs at all (GitHub
  # Actions does not apply declared input defaults outside workflow_call and
  # workflow_dispatch). This job resolves the same fail-safe defaults the
  # former workflow.yml caller used to pass, in exactly one place, so no
  # other job or step duplicates the literal fallback values.
  resolve-defaults:
    name: Resolve scheduled-run defaults
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frameworks: ${{ steps.defaults.outputs.frameworks }}
      soak-hours: ${{ steps.defaults.outputs.soak-hours }}
    steps:
      - id: defaults
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
          SOAK_HOURS: ${{ inputs.soak-hours }}
        run: |
          echo "frameworks=${FRAMEWORKS:-[\"go1-26\",\"go1-26-dev\"]}" >> "$GITHUB_OUTPUT"
          echo "soak-hours=${SOAK_HOURS:-6}" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote ${{ matrix.framework }}
    needs: [resolve-defaults]
    # RFC-013/ADR-0005: stable restaurado como referência oficial de consumo.
    # O kill switch abaixo continua existindo por design -- não é um relaxamento
    # temporário, é o controle operacional permanente que permite desligar a
    # promoção automática sem reverter código (ex.: durante uma reconciliação
    # de Infra, ou se um ciclo de promoção precisar de pausa manual). Os dois
    # ECRs Go só aceitam a escrita de `stable` de forma sustentável depois que
    # a Infra do produto aplica `IMMUTABLE_WITH_EXCLUSION` com a
    # exclusão exata `stable` (ver infra/ecr/main.tf) -- sem
    # isso, a primeira promoção teria sucesso mas a segunda falharia ao tentar
    # mover a tag (immutable tag mutation). A variável de repositório abaixo
    # é o kill switch: ausente/diferente de "true" -> job não roda, em nenhum
    # trigger (schedule ou dispatch manual). `STABLE_PROMOTION_AUTHORIZED=true`
    # só depois de confirmar (fresh `aws ecr describe-repositories`) que os
    # dois repositórios já refletem a exclusão de Infra.
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.STABLE_PROMOTION_AUTHORIZED == 'true'
    runs-on: ubuntu-latest
    # Observado: 11-40s num run real contra o ECR de verdade (M14). Margem
    # cobre o re-scan Trivy e variância de rede nas chamadas AWS/ECR.
    timeout-minutes: 10
    # Mesmo grupo em dispatch direto e workflow_call: seleção e push serializados.
    concurrency:
      group: promote-stable-${{ inputs.aws-role-arn || vars.AWS_ROLE_ARN }}-${{ inputs.aws-region || vars.AWS_REGION }}-${{ matrix.framework }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.resolve-defaults.outputs.frameworks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate workflow inputs before privileged operations
        env:
          FRAMEWORKS: ${{ needs.resolve-defaults.outputs.frameworks }}
          SOAK_HOURS: ${{ needs.resolve-defaults.outputs.soak-hours }}
        run: python3 -B -m scripts.pipeline.catalog.validate_inputs

      # inputs.aws-region/aws-role-arn só existem no workflow_call; no
      # schedule direto (produção) e no workflow_dispatch direto (usado pra
      # testar o gate manualmente) caem para as vars do repo.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ inputs.aws-role-arn || vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region || vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: List images in repository
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          set -eu
          aws ecr describe-images --repository-name "image-base-${FRAMEWORK}" --output json > images.json

      - name: Find promotion candidate (soak window)
        id: candidate
        env:
          FRAMEWORK: ${{ matrix.framework }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOAK_HOURS: ${{ needs.resolve-defaults.outputs.soak-hours }}
        run: |
          python3 -B -m scripts.pipeline.release.find_promotion_candidate \
            images.json "$SOAK_HOURS" "$REGISTRY" "image-base-${FRAMEWORK}" \
            policies/release/promotion-quarantine.json \
            --evidence reports/promotion-evidence.json

      # Re-scan por digest, já com o banco de CVE do Trivy atualizado em
      # relação ao momento do build original — é aqui que uma CVE divulgada
      # durante a janela de soak barra a promoção.
      - name: Install cosign
        if: steps.candidate.outputs.skip == 'false'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify candidate platforms, signature and provenance
        if: steps.candidate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.candidate.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: python3 -B -m scripts.pipeline.release.verify_promotion "$IMAGE_REF" "$GITHUB_REPOSITORY"

      - name: Install Trivy
        if: steps.candidate.outputs.skip == 'false'
        uses: alric-corp/alric-containers-reusable-workflows/actions/setup-trivy@eea2d2f4c4102ded74204e4131c1417f444ae3fc # governed Trivy setup

      - name: Record promotion tool versions
        if: steps.candidate.outputs.skip == 'false'
        run: python3 -B -m scripts.pipeline.operations.tool_versions promotion reports/tool-versions.json

      - name: Re-scan both architectures before promotion
        if: steps.candidate.outputs.skip == 'false'
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: python3 -B -m scripts.pipeline.artifacts.scan_images remote "$IMAGE_REF"

      # M11: mesma visibilidade não-bloqueante do build — nunca falha o
      # job, roda mesmo se o re-scan acima já bloqueou a promoção.
      # M12: `if: <condição>` sem always()/failure()/cancelled() herda
      # implicitamente `success()` do GitHub Actions — sem o `!cancelled()`
      # aqui, este passo era pulado quando o re-scan falhava, ao contrário
      # do que o comentário acima sempre afirmou. Confirmado empiricamente
      # num runner real antes da correção (PR #43, descartável): o mesmo
      # padrão sem o guard ficou `skipped` depois de um passo anterior
      # falhar; com o guard, rodou.
      - name: Report CVEs without an available fix (informational)
        if: ${{ !cancelled() && steps.candidate.outputs.skip == 'false' }}
        env:
          IMAGE_REF: ${{ steps.candidate.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: python3 -B -m scripts.pipeline.release.report_unfixed_cves remote "$IMAGE_REF"

      - name: Preserve promotion scan evidence
        if: ${{ !cancelled() && steps.candidate.outputs.skip == 'false' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-scans-${{ matrix.framework }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

      # docker buildx imagetools create retagueia o índice multi-arch por
      # referência (sem baixar/re-subir camadas), preservando o manifest
      # list amd64+arm64 tal como foi publicado.
      - name: Promote to stable
        id: promote
        if: steps.candidate.outputs.skip == 'false'
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -eu
          docker buildx imagetools create --tag "${IMAGE}:stable" "${IMAGE}@${DIGEST}"
          echo "tag escrita ${IMAGE}:${TAG} -> ${IMAGE}:stable; aguardando read-back"

      - name: Confirm stable via independent ECR read-back
        id: readback
        if: steps.candidate.outputs.skip == 'false'
        env:
          IMAGE: ${{ steps.candidate.outputs.image }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          python3 -B -m scripts.pipeline.release.verify_stable "$IMAGE" "$DIGEST" \
            --evidence reports/promotion-evidence.json

      # M11/M04: a evidência registra o que aconteceu de fato — promoveu, ou
      # pulou e por quê, com a idade real do stable medida pelo push no ECR.
      # `promoted` exige escrita e read-back do mesmo índice confirmados; este
      # passo roda mesmo quando a promoção falhou, para preservar o resultado.
      - name: Record promotion outcome
        if: ${{ !cancelled() }}
        env:
          PROMOTED: ${{ steps.promote.outcome == 'success' && steps.readback.outcome == 'success' }}
          SKIPPED: ${{ steps.candidate.outputs.skip }}
          REASON: ${{ steps.candidate.outputs.reason }}
        run: |
          set -eu
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('reports/promotion-evidence.json')
          # Sem o arquivo, a seleção do candidato não chegou a rodar (falha de
          # AWS/ECR, por exemplo): isso é diferente de "pulou por não ter
          # candidato" e a tabela do run precisa distinguir os dois.
          evaluated = path.is_file()
          evidence = json.loads(path.read_text()) if evaluated else {}
          evidence.setdefault('candidate_digest', evidence.get('digest'))
          evidence.setdefault('stable_digest_observed', None)
          evidence.setdefault('read_back_status', 'not_run')
          evidence['skipped'] = os.environ['SKIPPED'] == 'true'
          evidence['promoted'] = (os.environ['PROMOTED'] == 'true'
                                  and not evidence['skipped']
                                  and evidence['read_back_status'] == 'confirmed'
                                  and bool(evidence['candidate_digest'])
                                  and evidence['candidate_digest'] == evidence.get('digest')
                                  and evidence['stable_digest_observed'] == evidence['candidate_digest'])
          if not evaluated:
              evidence['reason'] = 'gate de promoção não chegou a avaliar candidato (ver log)'
          elif not evidence['promoted'] and not evidence['skipped']:
              evidence['reason'] = ('candidato elegível, promoção não concluída: '
                                    + (evidence.get('read_back_error') or os.environ['REASON']
                                       or evidence.get('reason') or 'ver log'))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY

      - name: Preserve promotion outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-${{ matrix.framework }}-${{ github.run_attempt }}
          path: reports/promotion-evidence.json
          retention-days: 30
          if-no-files-found: warn

  # RFC-013/ADR-0005: promover runtime e -dev de forma coordenada exige que
  # os dois venham do mesmo release aprovado -- cada leg da matrix acima
  # seleciona seu candidato de forma independente, então esta verificação
  # roda depois, sobre a evidência já escrita, e falha alto (sem desfazer
  # nada) se runtime e -dev não corresponderem ao mesmo run/attempt. Um
  # framework sem par -dev pedido no mesmo run (ex.: python3-13) não tem o
  # que verificar aqui -- não é falha.
  verify-pair:
    name: Verify runtime/dev promotion pair binding
    needs: [promote, resolve-defaults]
    if: ${{ !cancelled() && needs.promote.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download promotion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: evidence
          pattern: 'promotion-*'
          github-token: ${{ github.token }}

      - name: Verify runtime/dev pair binding
        env:
          FRAMEWORKS: ${{ needs.resolve-defaults.outputs.frameworks }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 -B -m scripts.pipeline.release.verify_promotion_pairs \
            "$FRAMEWORKS" evidence "$RUN_ATTEMPT" \
            --json reports/promotion-pair-binding.json

      - name: Preserve pair binding evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-pair-binding-${{ github.run_attempt }}
          path: reports/promotion-pair-binding.json
          retention-days: 30
          if-no-files-found: warn

  # M11/M04: mesma tabela do build, agora com a coluna de promoção preenchida.
  summary:
    name: Promotion summary
    needs: [promote, resolve-defaults]
    # Sem legs de promoção não há o que resumir; com qualquer resultado (mesmo
    # falha parcial) a tabela é justamente o que interessa.
    if: ${{ !cancelled() && needs.promote.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download promotion evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: evidence
          pattern: 'promotion-*'
          github-token: ${{ github.token }}

      - name: List artifacts of this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > artifacts.json || echo '{}' > artifacts.json

      - name: Publish per-framework promotion table
        env:
          FRAMEWORKS: ${{ needs.resolve-defaults.outputs.frameworks }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 -B -m scripts.pipeline.operations.pipeline_summary evidence \
            --frameworks "$FRAMEWORKS" --repository "$REPOSITORY" --run-id "$RUN_ID" \
            --artifacts artifacts.json --title 'Promoção por framework' \
            --markdown "$GITHUB_STEP_SUMMARY" --json reports/pipeline-summary.json

      - name: Preserve the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pipeline-summary-${{ github.run_attempt }}
          path: reports/pipeline-summary.json
          retention-days: 30
          if-no-files-found: warn
