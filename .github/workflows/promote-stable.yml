name: Distroless - Promote stable

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release exata r<RUN_ID>-a<ATTEMPT>; vazio seleciona a mais nova elegível'
        type: string
        default: ''
      soak-hours:
        description: 'Soak após DEV stable; 0 usa soak_hours de promote-hom.json'
        type: number
        default: 0
      resume-automation:
        description: 'Retomar após recovery; exige release explícita e mantém todos os gates'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  config:
    name: Read promotion configuration
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      promotion_authorized: ${{ steps.pipeline.outputs.PROMOTION_AUTHORIZED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope HOM

  promote:
    needs: config
    name: Authorize and promote stable candidates
    if: |
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.config.outputs.promotion_authorized == 'true'
    environment: HOM
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: stable-mutation-HOM-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate explicit release identity
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          python3 -B - <<'PY'
          import os
          from scripts.pipeline.release.lifecycle import manifest_key
          if os.environ['RELEASE']:
              manifest_key(os.environ['RELEASE'])
          PY
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope HOM --require-promotion
      - name: Configure HOM credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-duration-seconds: 10800
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - name: Authenticate source and destination registries
        run: |
          python3 -B -m scripts.pipeline.release.registry_login
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1, ORAS 1.3.1
      - name: Install Trivy
        uses: alric-corp/alric-containers-reusable-workflows/actions/setup-trivy@eea2d2f4c4102ded74204e4131c1417f444ae3fc # governed Trivy setup
      - name: Promote exact eligible release to HOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          SOAK_HOURS: ${{ inputs.soak-hours || steps.pipeline.outputs.MINIMUM_SOAK_HOURS }}
          RESUME: ${{ inputs.resume-automation }}
        run: |
          args=()
          if [ -n "$RELEASE" ]; then args+=(--release "$RELEASE"); fi
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          python3 -B -m scripts.pipeline.release.lifecycle promote-hom \
            --soak-hours "$SOAK_HOURS" --reports reports/release "${args[@]}"
      - name: Preserve HOM promotion evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-hom-${{ github.run_attempt }}
          path: reports/release/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve operational health evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: promotion-batch-${{ github.run_attempt }}
          path: reports/release/health/
          retention-days: 30
          if-no-files-found: warn
