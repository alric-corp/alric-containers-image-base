name: Distroless - Recover stable

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release anterior já promovida em HOM: r<RUN_ID>-a<ATTEMPT>'
        type: string
        required: true
      reason:
        description: 'Motivo operacional da recuperação'
        type: string
        required: true

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  recover:
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch'
    environment: HOM
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: stable-mutation-HOM-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate recovery request
        env:
          RELEASE: ${{ inputs.release }}
          REASON: ${{ inputs.reason }}
        run: |
          python3 -B - <<'PY'
          import os
          from scripts.pipeline.release.lifecycle import manifest_key
          manifest_key(os.environ['RELEASE'])
          if not os.environ['REASON'].strip():
              raise SystemExit('reason is required')
          PY
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope HOM
      - name: Configure HOM credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-duration-seconds: 10800
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1, ORAS 1.3.1
      - name: Install Trivy
        uses: alric-corp/alric-containers-reusable-workflows/actions/setup-trivy@eea2d2f4c4102ded74204e4131c1417f444ae3fc # governed Trivy setup
      - name: Reverify and recover the complete HOM release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          REASON: ${{ inputs.reason }}
        run: |
          python3 -B -m scripts.pipeline.release.lifecycle recover-hom \
            --release "$RELEASE" --reason "$REASON" --reports reports/release
      - name: Preserve recovery evidence and automation hold
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recovery-${{ github.run_attempt }}
          path: reports/release/
          retention-days: 30
          if-no-files-found: error
