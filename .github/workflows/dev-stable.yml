name: Distroless - DEV stable

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      release:
        description: 'Candidate validado r<RUN_ID>-a<ATTEMPT>; vazio seleciona o mais novo elegível'
        type: string
        default: ''
      resume-automation:
        description: 'Retomar uma escrita DEV interrompida; exige release explícita e todos os gates'
        type: boolean
        default: false
  workflow_call:
    inputs:
      frameworks:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: read

jobs:
  approve:
    if: github.ref == 'refs/heads/develop' && inputs.frameworks != '' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: DEV
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: stable-mutation-DEV-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this attempt's exact publication evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: publication-*-${{ github.run_attempt }}
          path: evidence
          merge-multiple: false
          digest-mismatch: error
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope DEV
      - name: Configure DEV credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-duration-seconds: 10800
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1, ORAS 1.3.1
      - name: Install Trivy
        uses: alric-corp/alric-containers-reusable-workflows/actions/setup-trivy@b87bda30545041ddb5d35c345ffc155bbc611dc8 # governed Trivy setup
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Verify release, run consumers, update DEV stable and persist manifest
        env:
          FRAMEWORKS: ${{ inputs.frameworks }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m scripts.pipeline.release.lifecycle approve-dev \
            --frameworks "$FRAMEWORKS" --evidence evidence --reports reports/release
      - name: Preserve DEV approval evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dev-${{ github.run_attempt }}
          path: reports/release/
          retention-days: 30
          if-no-files-found: error

  config:
    name: Read DEV promotion configuration
    if: github.ref == 'refs/heads/develop' && inputs.frameworks == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      promotion_authorized: ${{ steps.pipeline.outputs.PROMOTION_AUTHORIZED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope DEV

  promote:
    name: Promote validated DEV release
    needs: config
    if: github.ref == 'refs/heads/develop' && needs.config.outputs.promotion_authorized == 'true'
    environment: DEV
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: stable-mutation-DEV-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope DEV --require-promotion
      - name: Configure DEV credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-duration-seconds: 10800
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1, ORAS 1.3.1
      - name: Install Trivy
        uses: alric-corp/alric-containers-reusable-workflows/actions/setup-trivy@b87bda30545041ddb5d35c345ffc155bbc611dc8 # governed Trivy setup
      - name: Promote exact validated DEV release after configured soak
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
          RESUME: ${{ inputs.resume-automation }}
        run: |
          args=()
          if [ -n "$RELEASE" ]; then args+=(--release "$RELEASE"); fi
          if [ "$RESUME" = true ]; then args+=(--resume); fi
          python3 -B -m scripts.pipeline.release.lifecycle promote-dev \
            --reports reports/release "${args[@]}"
      - name: Preserve DEV promotion evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dev-promotion-${{ github.run_attempt }}
          path: reports/release/
          retention-days: 30
          if-no-files-found: error
