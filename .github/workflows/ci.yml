# Fast mandatory repository gate on Linux: unit tests, offline integration
# tests, GitHub Actions syntax, workflow hardening, immutable dependency/pin
# governance, and repository contracts. No image publication, AWS publication
# role assumption, Terraform apply, or hosted production golden path runs here.
# Windows/Git Bash is optional local developer testing, not hosted CI.
# Corporate execution target: ephemeral Linux self-hosted runners on Kubernetes
# managed by Actions Runner Controller (ARC). Current jobs use hosted Linux.
# Run on every PR without path filters so mandatory checks always report.
name: CI - Repository checks

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# M14: um novo commit no mesmo PR cancela a validação obsoleta em vez de
# rodar as duas até o fim; PRs diferentes (números diferentes) não se
# cancelam entre si, já que cada um tem seu próprio grupo. Só afeta este
# gate sem AWS — nunca compartilhado com os grupos de build-push/promote,
# que não podem ser cancelados por um PR/build novo (ver promote-stable.yml).
concurrency:
  group: fast-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    # Observado: ~24s num run real (M14).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Test pipeline unit contracts
        run: make test-unit
      - name: Test integration contracts without AWS
        run: make test-integration

  lint-workflows:
    name: Repository & workflow lint
    runs-on: ubuntu-latest
    # Observado: ~5s num run real (M14).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: actionlint
        run: |
          make lint-workflows ACTIONLINT="docker run --rm -v $PWD:/repo --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color"

      # M16: regras que o actionlint não checa — checkout sem credencial Git
      # persistida, nenhuma entrada interpolada dentro de `run`, limite de
      # duração por job executor, permissões declaradas, Actions por SHA
      # completo, origem/SHA pinado dos chamadores do executor compartilhado,
      # pins e retenção dos artifacts deste repositório e lote padrão do
      # catálogo. O executor compartilhado (alric-containers-reusable-workflows)
      # valida sua própria implementação/hardening/retenção no CI dele mesmo.
      - name: Workflow hardening and local contract coverage
        run: make lint-local
