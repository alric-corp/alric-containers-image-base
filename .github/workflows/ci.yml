# Gate rápido e obrigatório (M12): testes Python + actionlint em toda
# mudança, sem filtro de path. Um required check com filtro de path
# nunca dispara pra PR fora do escopo do filtro, e fica "pendente" pra
# sempre em vez de aprovar — por isso este workflow roda sempre (é
# rápido: segundos, não os minutos de melange/apko/Trivy do pipeline
# principal) e um PR só de documentação recebe resultado definido
# (sucesso) em vez de check obrigatório travado.
name: CI

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# M14: um novo commit no mesmo PR cancela a validação obsoleta em vez de
# rodar as duas até o fim; PRs diferentes (números diferentes) não se
# cancelam entre si, já que cada um tem seu próprio grupo. Só afeta este
# gate sem AWS — nunca compartilhado com os grupos de build-push/promote,
# que não podem ser cancelados por um PR/build novo (ver promote-stable.yml).
concurrency:
  group: fast-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Observado: ~24s num run real (M14).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Resolve reviewed reusable workflows
        id: shared
        run: python3 -B -m scripts.pipeline.governance.workflow_dependencies checkout
      - name: Checkout reusable workflows at the caller SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.ref }}
          path: .reusable-workflows
          persist-credentials: false
      - name: Record reusable workflow commit
        id: shared-commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git -C .reusable-workflows rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test pipeline unit contracts
        run: make test-unit
      - name: Test integration contracts without AWS
        run: make test-integration

  lint-workflows:
    runs-on: ubuntu-latest
    # Observado: ~5s num run real (M14).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install YAML parser
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Resolve reviewed reusable workflows
        id: shared
        run: python3 -B -m scripts.pipeline.governance.workflow_dependencies checkout
      - name: Checkout reusable workflows at the caller SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.shared.outputs.repository }}
          ref: ${{ steps.shared.outputs.ref }}
          path: .reusable-workflows
          persist-credentials: false
      - name: Record reusable workflow commit
        id: shared-commit
        shell: bash
        run: |
          set -euo pipefail
          printf 'sha=%s\n' "$(git -C .reusable-workflows rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: actionlint
        run: |
          make lint-workflows ACTIONLINT="docker run --rm -v $PWD:/repo --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color"

      # M16: regras que o actionlint não checa — checkout sem credencial Git
      # persistida, nenhuma entrada interpolada dentro de `run`, limite de
      # duração por job executor, permissões declaradas e Actions por SHA
      # completo. Vale daqui pra frente, não só na limpeza inicial.
      - name: Workflow hardening and tool pin coverage
        run: make lint-local

      # The same reviewed checkout supplies inputs, tool pins and retention.
      - name: Shared workflow and retention contracts
        run: make lint-shared
