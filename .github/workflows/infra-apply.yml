name: Infra - Apply

on:
  workflow_dispatch: {}

permissions: {}

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'

# Serializes the complete plan/apply transaction across dispatches.
concurrency:
  group: image-base-infra-state
  cancel-in-progress: false

jobs:
  plan:
    name: Plan product Infra
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: lab-image-base-infra
    permissions:
      contents: read
      id-token: write
    outputs:
      plan-artifact: infra-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install test dependencies
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Test Infra contracts without AWS credentials
        run: python3 -B -m unittest discover -s infra/tests -v
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff infra
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope INFRA_APPLY
      - name: Configure Infra apply credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - name: Ensure independent backend before init
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infra-plan"
          python3 infra/backend.py ensure \
            --bucket "$TF_STATE_BUCKET" --region "$TF_BACKEND_REGION" \
            --account-id "$AWS_ACCOUNT_ID" 2>&1 | tee "$RUNNER_TEMP/infra-plan/backend-ensure-plan.json"
      - name: Terraform init
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_BACKEND_REGION" 2>&1 | tee "$RUNNER_TEMP/infra-plan/init-plan.txt"
      - name: Terraform validate
        run: terraform -chdir=infra/ecr validate
      - name: Require the existing shared state and default workspace
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra/ecr show -json > "$RUNNER_TEMP/infra-selected-state.json"
          python3 infra/ecr/verify_state.py \
            --metadata infra/ecr/.terraform/terraform.tfstate \
            --state "$RUNNER_TEMP/infra-selected-state.json" \
            --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --region "$TF_BACKEND_REGION" \
            --workspace "$(terraform -chdir=infra/ecr workspace show)"
      - name: Plan and verify the catalog scope
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/infra-plan"
          terraform -chdir=infra/ecr plan -input=false -no-color -lock-timeout=5m \
            -var="aws_region=$AWS_REGION" -var="expected_bucket_owner=$AWS_ACCOUNT_ID" -out="$RUNNER_TEMP/infra-plan/infra.tfplan"
          terraform -chdir=infra/ecr show -no-color "$RUNNER_TEMP/infra-plan/infra.tfplan" > "$RUNNER_TEMP/infra-plan/plan.txt"
          terraform -chdir=infra/ecr show -json "$RUNNER_TEMP/infra-plan/infra.tfplan" > "$RUNNER_TEMP/infra-plan/plan.json"
          python3 infra/ecr/verify_plan.py "$RUNNER_TEMP/infra-plan/plan.json" --mode sbom-adoption --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION"
          python3 infra/s3/readback.py preflight --plan "$RUNNER_TEMP/infra-plan/plan.json" \
            --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --report "$RUNNER_TEMP/infra-plan/s3-preflight.json"
      - name: Bind plan to its revision and checksum
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/infra-plan"
          printf '%s\n' "$GITHUB_SHA" > revision.txt
          sha256sum infra.tfplan revision.txt > checksums.sha256
      - name: Publish plan summary
        run: |
          {
            echo '### Infra plan (controlled environment apply)'
            echo '```text'
            cat "$RUNNER_TEMP/infra-plan/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact plan and revision
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-apply-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-plan/
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply exact plan and verify zero drift
    needs: plan
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lab-image-base-infra
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install test dependencies
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Test Infra contracts without AWS credentials
        run: python3 -B -m unittest discover -s infra/tests -v
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Download exact plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.plan.outputs.plan-artifact }}
          path: ${{ runner.temp }}/infra-plan/
      - name: Verify plan checksum and revision
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/infra-plan"
          sha256sum --check checksums.sha256
          test "$(cat revision.txt)" = "$GITHUB_SHA"
      - name: Load versioned pipeline configuration
        id: pipeline
        run: python3 -B -m scripts.pipeline.governance.configuration --scope INFRA_APPLY
      - name: Configure Infra apply credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ steps.pipeline.outputs.AWS_ROLE_ARN }}
          aws-region: ${{ steps.pipeline.outputs.AWS_REGION }}
          allowed-account-ids: ${{ steps.pipeline.outputs.AWS_ACCOUNT_ID }}
      - name: Ensure independent backend before init
        run: |
          set -euo pipefail
          python3 infra/backend.py ensure \
            --bucket "$TF_STATE_BUCKET" --region "$TF_BACKEND_REGION" \
            --account-id "$AWS_ACCOUNT_ID" 2>&1 | tee "$RUNNER_TEMP/infra-backend-ensure.json"
      - name: Terraform init
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_BACKEND_REGION" 2>&1 | tee "$RUNNER_TEMP/infra-init.txt"
      - name: Require the existing shared state and default workspace
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra/ecr show -json > "$RUNNER_TEMP/infra-selected-state.json"
          python3 infra/ecr/verify_state.py \
            --metadata infra/ecr/.terraform/terraform.tfstate \
            --state "$RUNNER_TEMP/infra-selected-state.json" \
            --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --region "$TF_BACKEND_REGION" \
            --workspace "$(terraform -chdir=infra/ecr workspace show)"
      - name: Verify exact plan scope before apply
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr show -json "$RUNNER_TEMP/infra-plan/infra.tfplan" > "$RUNNER_TEMP/verified-plan.json"
          python3 infra/ecr/verify_plan.py "$RUNNER_TEMP/verified-plan.json" --mode sbom-adoption --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION"
          python3 infra/s3/readback.py preflight --plan "$RUNNER_TEMP/verified-plan.json" \
            --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --report "$RUNNER_TEMP/s3-preflight-apply.json"
      - name: Apply exact verified plan
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr apply -input=false -lock-timeout=5m \
            "$RUNNER_TEMP/infra-plan/infra.tfplan" 2>&1 | tee "$RUNNER_TEMP/infra-apply.txt"
      - name: Require no changes after apply
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr plan -input=false -no-color -lock-timeout=5m \
            -detailed-exitcode -var="aws_region=$AWS_REGION" -var="expected_bucket_owner=$AWS_ACCOUNT_ID" \
            -out="$RUNNER_TEMP/post-apply.tfplan" > "$RUNNER_TEMP/post-apply.txt" 2>&1 || drift_status=$?
          cat "$RUNNER_TEMP/post-apply.txt"
          if [ "${drift_status:-0}" -ne 0 ]; then
            echo '::error::Post-apply Terraform plan must return no changes; stop the infrastructure operation.'
            exit "${drift_status:-1}"
          fi
          terraform -chdir=infra/ecr show -json "$RUNNER_TEMP/post-apply.tfplan" > "$RUNNER_TEMP/post-apply.json"
          python3 infra/ecr/verify_plan.py "$RUNNER_TEMP/post-apply.json" --mode noop --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION"
          echo 'POST_APPLY_TERRAFORM_DRIFT = NONE' >> "$GITHUB_STEP_SUMMARY"
      - name: Read back AWS against the Infra contract
        run: |
          set -euo pipefail
          python3 infra/readback.py --account-id "$AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" 2>&1 | tee "$RUNNER_TEMP/infra-readback.json"
          echo 'OPERATIONAL_ECR_CONFIGURATION = VERIFIED' >> "$GITHUB_STEP_SUMMARY"
      - name: Read back the SBOM bucket and expose ingestion configuration
        run: |
          set -euo pipefail
          terraform -chdir=infra/ecr output -json > "$RUNNER_TEMP/infra-outputs.json"
          python3 infra/s3/readback.py readback --outputs "$RUNNER_TEMP/infra-outputs.json" \
            --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" \
            --report "$RUNNER_TEMP/s3-readback.json"
          terraform -chdir=infra/ecr output -json ingestion_config > "$RUNNER_TEMP/sbom-ingestion-config.json"
      - name: Upload apply verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infra-apply-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/infra-plan/backend-ensure-plan.json
            ${{ runner.temp }}/infra-plan/init-plan.txt
            ${{ runner.temp }}/infra-plan/plan.txt
            ${{ runner.temp }}/infra-plan/plan.json
            ${{ runner.temp }}/infra-backend-ensure.json
            ${{ runner.temp }}/infra-init.txt
            ${{ runner.temp }}/infra-apply.txt
            ${{ runner.temp }}/verified-plan.json
            ${{ runner.temp }}/post-apply.txt
            ${{ runner.temp }}/post-apply.json
            ${{ runner.temp }}/infra-readback.json
            ${{ runner.temp }}/s3-preflight-apply.json
            ${{ runner.temp }}/s3-readback.json
            ${{ runner.temp }}/sbom-ingestion-config.json
          retention-days: 5
          if-no-files-found: error
