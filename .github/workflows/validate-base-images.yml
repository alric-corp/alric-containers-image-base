# Product entry point. Executors live in the versioned reusable-workflow repository.
name: Factory Distroless - Validate base images
on:
  workflow_call:
    outputs:
      image-trust-result:
        description: "Result of the default trust integration gate."
        value: ${{ jobs.image-trust.outputs.result }}
    inputs:
      frameworks:
        description: "JSON array de frameworks a validar."
        type: string
        required: true
permissions:
  contents: read
jobs:
  wolfi-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install governance YAML dependency
        run: python3 -m pip install --quiet -r requirements-dev.txt
      - name: Verify reviewed Wolfi signing key and local keyrings
        run: python3 -B -m scripts.pipeline.governance.pin_inventory trust
  image-trust:
    needs: wolfi-trust
    uses: ./.github/workflows/image-trust.yml
    with:
      frameworks: ${{ inputs.frameworks }}
  validate:
    needs: wolfi-trust
    uses: alric-corp/alric-containers-reusable-workflows/.github/workflows/validate-apko-images.yml@7a9b055a462eeb8552d3404c26538b44e8ccd83f # reviewed shared workflows
    with:
      frameworks: ${{ inputs.frameworks }}
      melange-config: image-base-ca-certificates.yaml
      locked-build: true
